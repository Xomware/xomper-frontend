name: Deploy Frontend

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: Xomware/github-actions/.github/workflows/deploy-frontend-s3.yml@v1
    with:
      app: xomper
      node-version: '18'
      ssm: |
        API_ID=/xomper/api/API_ID
        COGNITO_USER_POOL_ID=/xomper/api/COGNITO_USER_POOL_ID
        COGNITO_CLIENT_ID=/xomper/api/COGNITO_CLIENT_ID
      build-command: |
        npx ng test --no-watch --browsers=ChromeHeadless
        f=src/environments/environment.ts
        sed -i "s|apiId: '---'|apiId: '$API_ID'|" $f
        sed -i "s|cognitoUserPoolId: '---'|cognitoUserPoolId: '$COGNITO_USER_POOL_ID'|" $f
        sed -i "s|cognitoClientId: '---'|cognitoClientId: '$COGNITO_CLIENT_ID'|" $f
        if grep -q "'---'" $f; then
          echo "::error::environment.ts still has '---' placeholders"
          exit 1
        fi
        npm run build -- --configuration production
      dist-dir: dist/xomper-frontend
      bucket: xomper.xomware.com
      domain: xomper.xomware.com
