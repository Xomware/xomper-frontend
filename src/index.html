<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Xomper</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Decides before first paint whether the landing intro plays: signed-out
    // visitors to / with motion allowed. IntroGateComponent takes it from here.
    (function () {
      if (location.pathname !== '/') return;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      try {
        // Amplify keeps the signed-in user under this key; / sends them to /home.
        for (var i = 0; i < localStorage.length; i++) {
          if (/^CognitoIdentityServiceProvider\..+\.LastAuthUser$/.test(localStorage.key(i))) return;
        }
      } catch (e) {
        // Storage blocked: nobody can be signed in, so play it.
      }
      document.documentElement.setAttribute('data-intro', 'poster');
    })();
  </script>
  <style>
    /* The intro's first frame (src/app/components/intro): the stadium before
       the lights strike, painted before any JS. Keep it in step with
       intro.component.scss. */
    html[data-intro] {
      overflow: hidden;
    }
    .xi-poster {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: #040507;
    }
    html[data-intro='poster'] .xi-poster {
      display: block;
    }
    @media (prefers-reduced-motion: reduce) {
      html[data-intro='poster'] .xi-poster {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="xi-poster" aria-hidden="true"></div>
  <app-root></app-root>
</body>
</html>
