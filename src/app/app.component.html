<app-space-backdrop></app-space-backdrop>

<!-- Public landing: toolbar and footer, but no sidebar. The sidebar is
     signed-in navigation and reads as a broken dashboard to a visitor who has
     never signed in; the toolbar and footer are the front door's own chrome. -->
<ng-container *ngIf="isPublicLanding; else appChrome">
  <div class="app-container app-container--landing">
    <app-toolbar></app-toolbar>
    <main id="main-content" class="content" role="main" tabindex="-1">
      <router-outlet></router-outlet>
    </main>
    <app-footer></app-footer>
  </div>
</ng-container>

<ng-template #appChrome>
  <!-- Legacy chrome — rendered when ?newShell=1 is NOT active (default prod path) -->
  <ng-container *xomperNewShell="false">
    <div class="app-container">
      <app-toolbar></app-toolbar>
      <main id="main-content" class="content" role="main">
        <app-toast></app-toast>
        <router-outlet></router-outlet>
      </main>
      <app-footer></app-footer>
    </div>
  </ng-container>

  <!-- New shell — rendered when ?newShell=1 is active -->
  <ng-container *xomperNewShell="true">
    <app-shell-layout></app-shell-layout>
  </ng-container>
</ng-template>

<app-intro-gate></app-intro-gate>
