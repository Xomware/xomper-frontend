<div class="stage" aria-hidden="true">
  <div class="sky"></div>

  <!-- Every layer below shares one viewBox, so their coordinates line up. -->
  <div class="layer towers">
    <svg viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
      @for (x of towers; track x) {
        <rect class="pole" [attr.x]="x - 3" y="296" width="6" height="150" />
        <rect class="bank" [attr.x]="x - 32" y="258" width="64" height="40" rx="3" />
        @for (l of lamps; track l) {
          <circle class="lamp" [attr.cx]="x - 21 + (l % 4) * 14" [attr.cy]="l < 4 ? 270 : 286" r="5" />
        }
      }
    </svg>
  </div>

  <div class="layer field">
    <svg viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="xi-turf" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0d3a26" />
          <stop offset="1" stop-color="#0a2a1c" />
        </linearGradient>
      </defs>
      <polygon class="turf" points="270,440 530,440 1258,1000 -458,1000" fill="url(#xi-turf)" />
      @for (line of lines; track line.y; let i = $index) {
        @if (i % 2 === 0 && i < lines.length - 1) {
          <polygon
            class="stripe"
            [attr.points]="
              (400 - line.half) + ',' + line.y + ' ' + (400 + line.half) + ',' + line.y + ' ' +
              (400 + lines[i + 1].half) + ',' + lines[i + 1].y + ' ' + (400 - lines[i + 1].half) + ',' + lines[i + 1].y
            "
          />
        }
      }
      <polygon class="endzone" points="270,440 530,440 489.5,425 310.5,425" />
      @for (line of lines; track line.y) {
        <line class="yard" [attr.x1]="400 - line.half" [attr.x2]="400 + line.half" [attr.y1]="line.y" [attr.y2]="line.y" />
      }
      <line class="yard" x1="270" y1="440" x2="-458" y2="1000" />
      <line class="yard" x1="530" y1="440" x2="1258" y2="1000" />
      <path class="posts" d="M400 425V412M372 408H428M372 408V366M428 408V366" />
    </svg>
  </div>

  <div class="layer beams">
    <svg viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="xi-beam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#eafff5" stop-opacity="0.5" />
          <stop offset="1" stop-color="#eafff5" stop-opacity="0" />
        </linearGradient>
        <radialGradient id="xi-halo">
          <stop offset="0" stop-color="#f4fff9" />
          <stop offset="0.3" stop-color="#bfffe6" stop-opacity="0.6" />
          <stop offset="1" stop-color="#00ffab" stop-opacity="0" />
        </radialGradient>
      </defs>
      @for (x of towers; track x) {
        <polygon
          class="beam"
          [attr.points]="(x - 24) + ',290 ' + (x + 24) + ',290 ' + (x < 400 ? '560,760 300,700' : '500,700 240,760')"
          fill="url(#xi-beam)"
        />
        <circle [attr.cx]="x" cy="278" r="46" fill="url(#xi-halo)" />
        @for (l of lamps; track l) {
          <circle class="lamp-lit" [attr.cx]="x - 21 + (l % 4) * 14" [attr.cy]="l < 4 ? 270 : 286" r="5" />
        }
      }
    </svg>
  </div>

  <div class="layer play">
    <svg viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
      <path class="route" pathLength="1" d="M232 633C236 560 250 520 300 492" />
      <path class="route route--b" pathLength="1" d="M568 633C566 580 560 545 520 500" />
      <path class="route route--c" pathLength="1" d="M448 633L452 590L494 578" />
      <path class="arrow" d="M289 488L300 492L292 502" />
      <path class="arrow arrow--b" d="M518 513L520 500L533 501" />
      <path class="arrow arrow--c" d="M485 570L494 578L484 584" />
      @for (p of offense; track $index) {
        <ellipse
          class="mark mark--o"
          [attr.cx]="p.x"
          [attr.cy]="p.y"
          [attr.rx]="10 * p.size"
          [attr.ry]="6.5 * p.size"
          [attr.stroke-width]="2.4 * p.size"
          [style.animation-delay.ms]="1000 + p.delay"
        />
      }
      @for (p of defense; track $index) {
        <path
          class="mark mark--x"
          [attr.d]="
            'M' + (p.x - 8 * p.size) + ' ' + (p.y - 6 * p.size) + 'L' + (p.x + 8 * p.size) + ' ' + (p.y + 6 * p.size) +
            'M' + (p.x + 8 * p.size) + ' ' + (p.y - 6 * p.size) + 'L' + (p.x - 8 * p.size) + ' ' + (p.y + 6 * p.size)
          "
          [attr.stroke-width]="2.6 * p.size"
          [style.animation-delay.ms]="1000 + p.delay"
        />
      }
      <path class="trail" pathLength="1" d="M400 700Q412 430 400 372" />
      <path class="goal" d="M372 408H428M372 408V366M428 408V366" />
    </svg>
  </div>

  <div class="ball">
    <svg viewBox="-20 -12 40 24">
      <g class="ball-spin">
        <ellipse rx="18" ry="10.5" class="leather" />
        <path class="seam" d="M-12.5 -7.4Q-14 0 -12.5 7.4M12.5 -7.4Q14 0 12.5 7.4" />
        <path class="laces" d="M-6 0H6M-4 -2.4V2.4M-1.3 -2.4V2.4M1.3 -2.4V2.4M4 -2.4V2.4" />
      </g>
    </svg>
  </div>
  <span class="burst"></span>

  <div class="dim"></div>

  <div class="board-wrap">
    <div class="board">
      @for (i of slats; track i) {
        <div class="slat" [style.--i]="i">
          <div class="face face--front">
            <div class="panel">
              <div class="team">
                <span class="team-name">Home</span>
                <span class="score score--home">
                  <span class="digits digits--old">20</span>
                  <span class="digits digits--new">23</span>
                </span>
              </div>
              <div class="clock">
                <span class="period">Q4</span>
                <span class="time">0:03</span>
              </div>
              <div class="team">
                <span class="team-name">Away</span>
                <span class="score"><span class="digits">21</span></span>
              </div>
            </div>
          </div>
          <div class="face face--back"></div>
        </div>
      }
    </div>
  </div>

  <p class="tagline">{{ tagline }}</p>
</div>

<button type="button" class="skip" aria-label="Skip intro" (click)="done.emit()">Skip</button>
